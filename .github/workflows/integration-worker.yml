name: Procesar avisos y recordatorios
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: akrasia-integration-worker
  cancel-in-progress: false
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Procesar cola privada
        env:
          AKRASIA_APP_URL: ${{ vars.AKRASIA_APP_URL }}
          INTEGRATION_WORKER_SECRET: ${{ secrets.INTEGRATION_WORKER_SECRET }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.error, urllib.parse, urllib.request
          origin = os.environ.get('AKRASIA_APP_URL', '').rstrip('/')
          secret = os.environ.get('INTEGRATION_WORKER_SECRET', '')
          if not origin or not secret:
              print('::notice::Worker pendiente de configurar: variable de URL y secreto de integraciones.')
              raise SystemExit(0)
          url = urllib.parse.urlsplit(origin)
          if (url.scheme != 'https' or not url.hostname or url.username or url.password or url.path or url.query or url.fragment
                  or re.search(r'\s', origin) or not re.fullmatch(r'[a-fA-F0-9]{64}', secret)):
              print('::error::Configuración del worker inválida.')
              raise SystemExit(1)
          request = urllib.request.Request(origin + '/api/integrations/process', method='POST',
              headers={'Authorization': 'Bearer ' + secret})
          # Never follow a redirect with the private Authorization header.
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          try:
              with opener.open(request, timeout=58) as response:
                  raw = response.read(16385)
                  if len(raw) > 16384:
                      raise ValueError()
                  result = json.loads(raw)
              fields = ('processed', 'accepted', 'retry', 'failed', 'uncertain', 'disabled', 'cleaned')
              if not isinstance(result, dict) or any(type(result.get(field)) is not int or result[field] < 0 for field in fields):
                  raise ValueError()
              print('Cola procesada: ' + ', '.join(field + '=' + str(result[field]) for field in fields))
          except urllib.error.HTTPError as error:
              print('::error::El worker respondió con estado HTTP ' + str(error.code) + '.')
              raise SystemExit(1)
          except Exception:
              print('::error::No se pudo verificar el resultado del worker.')
              raise SystemExit(1)
          PY
