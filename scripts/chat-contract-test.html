<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A07 · Contrato de chat y reservas</title>
  <style>
    :root{font:15px system-ui,sans-serif;color-scheme:dark;background:#08131b;color:#d3e6ec}
    body{max-width:1100px;margin:28px auto;padding:0 20px}h1{color:#86e4c9;font-size:25px}p{line-height:1.5}
    button,textarea{font:inherit;padding:10px;border:1px solid #3d796d;background:#122e31;color:#d7f9eb;border-radius:5px}
    textarea{display:block;width:95%;margin:10px 0;min-height:65px}button:disabled{opacity:.4}
    #conversation{border:1px solid #33666b;border-radius:8px;padding:18px;margin:18px 0;min-height:130px}
    [data-role]{padding:10px;margin:8px 0;background:#132632;white-space:pre-wrap;overflow-wrap:anywhere}[data-role=user]{background:#193339}
    #booking-result{margin:18px 0;padding:12px;background:#162d2b}#booking-result:empty{display:none}
    pre{background:#030c12;border:1px solid #244750;padding:16px;white-space:pre-wrap;max-height:550px;overflow:auto}
    #status{font-weight:600;color:#a6f7c1}a{color:#9eefd4}
  </style>
</head>
<body>
  <h1>A07 · Mensajes y acciones con autoridad limitada</h1>
  <p>ChatProvider, tarjeta de reserva y Markdown reales; sesión, proveedor y almacenamiento sintéticos. Sin IA de pago, reservas ni notificaciones reales.</p>
  <p id="status">Preparando pruebas…</p><button id="rerun" disabled>Repetir comprobación</button>
  <div id="conversation"></div><pre id="results" aria-live="polite"></pre>
  <script type="module" src="/scripts/chat-contract-browser.tsx"></script>
</body>
</html>
